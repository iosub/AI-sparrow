# Configuración personalizada para Sparrow con Ollama
# Copia este archivo a sparrow-ml/llm/config.properties cuando esté listo

[settings]
# LLM Model and API settings - Configurado para Ollama
llm_function = qwen2.5vl:7b
ollama_base_url = http://127.0.0.1:11434/v1
protected_access = false
use_database = false

[keys]
# Sparrow API keys (para testing local)
key1_value = local-dev-key-001
key1_usage_count = 0
key1_usage_limit = 1000
key2_value = local-dev-key-002
key2_usage_count = 0
key2_usage_limit = 500

[database]
# Oracle database connection settings (opcional para analytics)
user = SCOTT
password = TIGER
host = 127.0.0.1
port = 1521
service = freepdb1

# Notas:
# - Usar modelos vision de Ollama como llama3.2-vision, qwen2-vl, etc.
# - Verificar que Ollama esté ejecutándose en puerto 11434
# - Para modelos grandes, asegurar suficiente RAM/VRAM